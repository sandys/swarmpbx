# Postgres and kine for e2e/run_events_e2e.sh, on their own bridge network.
# The script runs the api and the orchestrator on the same network.
name: ad-events

networks:
  events: {}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ad
      POSTGRES_PASSWORD: ad
      POSTGRES_DB: ad
    networks: [events]

  # kine retries Postgres until it answers.
  kine:
    image: rancher/kine:v0.13.17
    command:
      - --endpoint=postgres://ad:ad@postgres:5432/ad?sslmode=disable
      - --listen-address=0.0.0.0:2379
      - --compact-interval=5m
    networks: [events]
