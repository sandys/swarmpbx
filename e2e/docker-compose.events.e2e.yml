# Event-driven e2e stack: Postgres only. Postgres is the event layer (an event
# table plus LISTEN/NOTIFY). The orchestrator (our image) is started by
# run_events_e2e.sh with a failing gateway, so we test the event layer (breaker
# trip, retry storage, re-admission) deterministically without the media
# stack. Host networking so the orchestrator container reaches it on 127.0.0.1.
services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: ad
      POSTGRES_PASSWORD: ad
      POSTGRES_DB: ad
    command: ["postgres", "-p", "5432"]
