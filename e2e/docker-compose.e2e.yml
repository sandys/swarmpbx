# End-to-end stack for the orchestrator -> gateway -> real call test.
#
# The subject under test is OUR orchestrator: it wins leadership, claims the
# hopper, and originates a call through ad_gateway (LiveKit outbound SIP). The
# call reaches a local SIP UAS (sipp) that answers and streams audio; the agent
# subscribed in the room must receive it.
#
# Host networking so SIP/RTP/WebRTC ports work without NAT (WSL2), matching the
# proven MVP harness.
services:
  redis:
    image: redis:7
    network_mode: host
    command: ["redis-server", "--port", "6379"]

  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: ad
      POSTGRES_PASSWORD: ad
      POSTGRES_DB: ad
    command: ["postgres", "-p", "5432"]

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ../spike/livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]

  livekit-sip:
    image: livekit/sip:latest
    network_mode: host
    command: ["--config", "/etc/sip.yaml"]
    volumes:
      - ../spike/livekit/sip.yaml:/etc/sip.yaml:ro
    depends_on: [redis, livekit]

  agent:
    build:
      context: ../spike/livekit/agent
    network_mode: host
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret_devsecret_devsecret_32b
      AGENT_ROOM: campaign-1
      AGENT_IDENTITY: e2e-agent
    depends_on: [livekit]
