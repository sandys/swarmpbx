#!KAMAILIO
#
# The SIP edge of the cluster e2e (PLAN.md §0.0, decision D-9). A stateful
# proxy that keeps itself on the path of every call with Record-Route, so
# each later message of a call (ACK, BYE, re-INVITE) reaches the dialer node
# that owns it. It carries no audio: RTP goes straight between the carrier
# and the node.
#
# The dialer nodes reach it on the cluster network, and it reaches the
# carrier through the NAT. On Kubernetes, give the carrier side a public
# address: a second listen socket with `advertise` set to that address.
#
# Click-to-call: the provider (Twilio) calls the phone and then sends an
# INVITE here, over UDP or TCP. The INVITE names its node in `x-ad-node`
# (route[INBOUND]). For a tunnel to the TCP socket (ngrok), set
# AD_EDGE_TCP_HOST and AD_EDGE_TCP_PORT to the tunnel's public address, so
# that the provider's later requests of the call come back through it.

debug=2
log_stderror=yes
children=4
tcp_children=4
auto_aliases=no

dns=no
rev_dns=no

#!trydefenvs EDGE_TCP_HOST=AD_EDGE_TCP_HOST
#!trydefenv EDGE_TCP_PORT=AD_EDGE_TCP_PORT

listen=udp:10.20.0.10:5060
#!ifdef EDGE_TCP_HOST
listen=tcp:10.20.0.10:5060 advertise EDGE_TCP_HOST:EDGE_TCP_PORT
#!else
listen=tcp:10.20.0.10:5060
#!endif

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ipops.so"

modparam("rr", "append_fromtag", 0)

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        exit;
    }
    if (is_method("OPTIONS") && uri == myself && !has_totag()) {
        sl_send_reply("200", "OK");
        exit;
    }

    # A request inside a call follows the route set that Record-Route built.
    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        }
        if (is_method("ACK") && t_check_trans()) {
            route(RELAY);
        }
        sl_send_reply("404", "Not here");
        exit;
    }
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }
    t_check_trans();

    if (!is_method("INVITE")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }
    if (is_present_hf("x-ad-call")) {
        route(INBOUND);
    }

    # Any other new call comes only from a dialer node, toward the carrier.
    # Never relay for anyone else.
    if (!is_in_subnet("$si", "10.20.0.0/24")) {
        sl_send_reply("403", "Forbidden");
        exit;
    }
    if (uri == myself) {
        sl_send_reply("404", "No trunk in the Request-URI");
        exit;
    }
    # The node preloads a Route to us (its outbound proxy), so that its CANCEL
    # follows the INVITE. Drop it; the Request-URI names the carrier.
    remove_hf("Route");
    record_route();
    xlog("L_INFO", "call $ci from $si to $ru\n");
    route(RELAY);
}

# A click-to-call INVITE from the provider. `x-ad-node` names the node that
# waits for it, as ip:port; only a node of the cluster network is a target.
# The node checks the call's token in `x-ad-call`.
route[INBOUND] {
    $var(node) = $hdr(x-ad-node);
    if ($var(node) == $null || $var(node) == ""
            || !is_in_subnet("$(var(node){s.select,0,:})", "10.20.0.0/24")) {
        sl_send_reply("404", "No such call");
        exit;
    }
    record_route();
    $du = "sip:" + $var(node) + ";transport=udp";
    xlog("L_INFO", "inbound call $ci from $si to node $var(node)\n");
    route(RELAY);
}

route[RELAY] {
    # rport in our Via (RFC 3581): behind a NAT that changes the source port
    # (the AWS NAT gateway), the carrier must reply to the port it saw.
    add_local_rport();
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
