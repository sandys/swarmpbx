[package]
name = "ad_gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The real LiveKit server-SDK client. Off by default so the crate (and the fast
# test tier) build without the heavy SDK; the orchestrator binary enables it.
default = []
livekit = ["dep:livekit-api"]
# Our own native WebRTC participant (the SIP<->WebRTC bridge, §0.9a option 2).
# Pulls libwebrtc via the livekit SDK; heavy native build, so off by default.
webrtc = ["dep:livekit", "dep:livekit-api", "dep:futures-util"]

[dependencies]
ad_core = { path = "../ad_core" }
ad_lead = { path = "../ad_lead" }
ad_dispatch = { path = "../ad_dispatch" }
serde = { workspace = true }
tokio = { workspace = true }
livekit = { version = "0.9", optional = true }
livekit-api = { version = "0.8", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true }
