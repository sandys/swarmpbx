[package]
name = "ad_gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The WebRTC bridge (libwebrtc via the livekit SDK) is part of the normal build.
# It needs clang 21+ and glib-2.0; Dockerfile.test and Dockerfile provide them.
[dependencies]
ad_core = { path = "../ad_core" }
ad_lead = { path = "../ad_lead" }
ad_dispatch = { path = "../ad_dispatch" }
ad_sip = { path = "../ad_sip" }
ad_media = { path = "../ad_media" }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
livekit = "0.9"
ad_livekit = { path = "../ad_livekit" }
serde_json = { workspace = true }
thiserror = { workspace = true }
livekit-protocol = "0.8"
futures-util = "0.3"
# Click-to-call: the Twilio Calls API (HTTPS) and the call tokens.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"

[dev-dependencies]
chrono = { workspace = true }
base64 = "0.21"
sha2 = "0.10"
url = "2"
tokio = { workspace = true }
