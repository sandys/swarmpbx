name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Docker-first: the exact same compose developers run locally. fmt +
      # clippy + the full test suite (including the Postgres integration
      # tests) all run inside containers. No host Rust toolchain is used.
      - name: run dockerized test tier
        run: >-
          docker compose -f docker-compose.test.yml up
          --build --abort-on-container-exit --exit-code-from tests
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  webrtc-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The audio proof for the SIP<->WebRTC bridge: our native WebRTC
      # participant carries two-way audio into a LiveKit room with the agent,
      # with no livekit/sip. The script builds the probe in the test image,
      # starts the stack with host networking, asserts, and always tears down.
      - name: run webrtc e2e
        run: ./e2e/run_webrtc_e2e.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One node leads through kine; a real LiveKit agent and a real pipecat
      # bot each join a call room before the dial; a SIPp UAS answers; each
      # agent receives audio. The script always tears down.
      - name: run orchestrator call e2e
        run: ./e2e/run_e2e.sh

  events-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Failures pause the campaign by the breaker and schedule retries.
      - name: run events e2e
        run: ./e2e/run_events_e2e.sh

  cluster-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Three nodes share the calls through kine with both agent runtimes; the
      # script kills a node and then the leader, and checks that every lead is
      # dialed exactly once. The script always tears down.
      - name: run cluster e2e
        run: ./e2e/run_cluster_e2e.sh

  twilio-sim-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The quickstart stack (README.md) with the carrier simulator in place
      # of the trunk, on the steps of "Call through Twilio": the steps must keep
      # working. The script always tears down.
      - name: run the quickstart stack against the simulator
        run: ./e2e/run_twilio_e2e.sh --sim

  twilio-c2c-sim-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Click-to-call (README.md, "Click-to-call through Twilio"): the
      # simulator is Twilio's Calls API and the phones, and its INVITE comes
      # to the node through Kamailio over TCP. The script always tears down.
      - name: run click-to-call against the simulator
        run: ./e2e/run_twilio_c2c_e2e.sh --sim

  twilio-e2e:
    runs-on: ubuntu-latest
    env:
      TWILIO_SID: ${{ secrets.TWILIO_SID }}
      TWILIO_SECRET: ${{ secrets.TWILIO_SECRET }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
    steps:
      - uses: actions/checkout@v4
      # A real call through Twilio Elastic SIP Trunking to Twilio's free
      # "Play" number. It runs only when the repository has the secrets.
      - name: write .env from the secrets
        if: env.TWILIO_SID != ''
        run: |
          umask 077
          {
            echo "TWILIO_SID=$TWILIO_SID"
            echo "TWILIO_SECRET=$TWILIO_SECRET"
            if [ -n "$TWILIO_ACCOUNT_SID" ]; then echo "TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID"; fi
          } > .env
      - name: run the live Twilio e2e
        if: env.TWILIO_SID != ''
        run: ./e2e/run_twilio_e2e.sh

  lkcloud-e2e:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_SIP_URI: ${{ secrets.LIVEKIT_SIP_URI }}
    steps:
      - uses: actions/checkout@v4
      # The README quickstart: a real call over the internet to the project's
      # LiveKit number at LiveKit Cloud SIP. It runs only when the repository
      # has the secrets.
      - name: write .env from the secrets
        if: env.LIVEKIT_SIP_URI != ''
        run: |
          umask 077
          {
            echo "LIVEKIT_URL=$LIVEKIT_URL"
            echo "LIVEKIT_API_KEY=$LIVEKIT_API_KEY"
            echo "LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET"
            echo "LIVEKIT_SIP_URI=$LIVEKIT_SIP_URI"
          } > .env
      - name: run the LiveKit Cloud e2e
        if: env.LIVEKIT_SIP_URI != ''
        run: ./e2e/run_lkcloud_e2e.sh
