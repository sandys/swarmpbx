name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Docker-first: the exact same compose developers run locally. fmt +
      # clippy + the full test suite (including the Postgres integration
      # tests) all run inside containers. No host Rust toolchain is used.
      - name: run dockerized test tier
        run: >-
          docker compose -f docker-compose.test.yml up
          --build --abort-on-container-exit --exit-code-from tests
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  webrtc-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The audio proof for the SIP<->WebRTC bridge: our native WebRTC
      # participant carries two-way audio into a LiveKit room with the agent,
      # with no livekit/sip. The script builds the probe in the test image,
      # starts the stack with host networking, asserts, and always tears down.
      - name: run webrtc e2e
        run: ./e2e/run_webrtc_e2e.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One node leads through kine; a real LiveKit agent and a real pipecat
      # bot each join a call room before the dial; a SIPp UAS answers; each
      # agent receives audio. The script always tears down.
      - name: run orchestrator call e2e
        run: ./e2e/run_e2e.sh

  events-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Failures pause the campaign by the breaker and schedule retries.
      - name: run events e2e
        run: ./e2e/run_events_e2e.sh

  cluster-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Three nodes share the calls through kine with both agent runtimes; the
      # script kills a node and then the leader, and checks that every lead is
      # dialed exactly once. The script always tears down.
      - name: run cluster e2e
        run: ./e2e/run_cluster_e2e.sh
