# The orchestrator replicas are the agentdialer cluster nodes (PLAN.md
# §0.10.8b). Each replica holds its node key in kine and runs the calls that
# the leader assigns to it; one replica also holds the leader key and
# schedules. Scale the Deployment to add nodes. There is deliberately NO
# Service object: nothing calls the orchestrator; it is a background loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentdialer.fullname" . }}-orchestrator
  labels:
    {{- include "agentdialer.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  # Recreate keeps rollouts simple. A stopping node deletes its kine keys on
  # SIGTERM, so the leader moves its calls at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentdialer.name" . }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        {{- include "agentdialer.labels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: {{ include "agentdialer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["orchestrator"]
          # The env set must match the orchestrator contract in
          # crates/ad_bin/src/config.rs. A test in ad_bin fails on drift.
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AD_BATCH_LIMIT
              value: {{ .Values.orchestrator.batchLimit | quote }}
            - name: AD_CALLS_PER_SEC
              value: {{ .Values.orchestrator.callsPerSec | quote }}
            - name: AD_RETRY_SWEEP_MS
              value: {{ .Values.orchestrator.retrySweepMs | quote }}
            - name: AD_EVENT_SWEEP_MS
              value: {{ .Values.orchestrator.eventSweepMs | quote }}
            - name: AD_ETCD_ENDPOINTS
              value: {{ .Values.cluster.etcdEndpoints | quote }}
            # The node carries its calls (PLAN.md §0.0): its SIP user agent
            # sends through the SIP edge and advertises the pod IP.
            - name: AD_DIAL_PROVIDER
              value: {{ .Values.telephony.provider | quote }}
            {{- if .Values.sip.trunk }}
            - name: AD_SIP_TRUNK
              value: {{ .Values.sip.trunk | quote }}
            {{- end }}
            {{- if eq .Values.telephony.provider "twilio_click_to_call" }}
            {{- with .Values.telephony.twilio }}
            {{- if .apiUrl }}
            - name: AD_TWILIO_API_URL
              value: {{ .apiUrl | quote }}
            {{- end }}
            - name: AD_TWILIO_ACCOUNT_SID
              value: {{ .accountSid | quote }}
            - name: AD_TWILIO_SIP_URI
              value: {{ .sipUri | quote }}
            - name: AD_TWILIO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | quote }}
                  key: AD_TWILIO_API_KEY
            - name: AD_TWILIO_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | quote }}
                  key: AD_TWILIO_API_SECRET
            {{- end }}
            {{- end }}
            {{- if .Values.sip.callerId }}
            - name: AD_SIP_CALLER_ID
              value: {{ .Values.sip.callerId | quote }}
            {{- end }}
            {{- if .Values.sip.proxy }}
            - name: AD_SIP_PROXY
              value: {{ .Values.sip.proxy | quote }}
            {{- end }}
            - name: AD_SIP_ADVERTISE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AD_ATTEMPT_CHECK_MS
              value: {{ .Values.orchestrator.attemptCheckMs | quote }}
            {{- include "agentdialer.dbEnv" . | nindent 12 }}
            {{- include "agentdialer.livekitEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
