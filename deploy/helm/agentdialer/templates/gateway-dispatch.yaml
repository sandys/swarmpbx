{{- if .Values.gateway.enabled }}
# Gateway media pods bridge SIP<->WebRTC. They use hostNetwork and a fixed RTP
# port range because SIP/RTP carry IPs inside the packets and cannot sit behind
# a normal ClusterIP Service (PLAN.md §0.5). Pin them to media nodes that expose
# the SIP/RTP ports. This runs the gateway control alongside the media engine
# (rtpengine / LiveKit SIP) on the node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentdialer.fullname" . }}-gateway
  labels:
    {{- include "agentdialer.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentdialer.name" . }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "agentdialer.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      hostNetwork: {{ .Values.gateway.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "agentdialer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["dispatch"]
          env:
            - name: AD_SIP_PORT
              value: {{ .Values.gateway.sipPort | quote }}
            - name: AD_RTP_PORT_START
              value: {{ .Values.gateway.rtpPortStart | quote }}
            - name: AD_RTP_PORT_END
              value: {{ .Values.gateway.rtpPortEnd | quote }}
            {{- include "agentdialer.dbEnv" . | nindent 12 }}
            {{- include "agentdialer.livekitEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
{{- end }}
{{- if .Values.dispatch.enabled }}
---
# Stateless dispatch workers. They claim leads via SKIP LOCKED and scale freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentdialer.fullname" . }}-dispatch
  labels:
    {{- include "agentdialer.labels" . | nindent 4 }}
    app.kubernetes.io/component: dispatch
spec:
  replicas: {{ .Values.dispatch.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentdialer.name" . }}
      app.kubernetes.io/component: dispatch
  template:
    metadata:
      labels:
        {{- include "agentdialer.labels" . | nindent 8 }}
        app.kubernetes.io/component: dispatch
    spec:
      containers:
        - name: dispatch
          image: {{ include "agentdialer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["dispatch"]
          env:
            {{- include "agentdialer.dbEnv" . | nindent 12 }}
            {{- include "agentdialer.livekitEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.dispatch.resources | nindent 12 }}
{{- if .Values.dispatch.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentdialer.fullname" . }}-dispatch
  labels:
    {{- include "agentdialer.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agentdialer.fullname" . }}-dispatch
  minReplicas: {{ .Values.dispatch.hpa.minReplicas }}
  maxReplicas: {{ .Values.dispatch.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.dispatch.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
