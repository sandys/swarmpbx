# AgentDialer values. One image, four roles (PLAN.md §5). The orchestrator
# replicas are the cluster nodes, and each node carries its own calls (SIP and
# RTP, PLAN.md §0.0) as a normal pod: no hostNetwork, no RTP port range.
#
# The environment each role needs is defined in crates/ad_bin/src/config.rs and
# listed in README.md ("Configuration"). A test in ad_bin fails when a template
# here does not pass a required variable, or passes one the binary does not read.

image:
  repository: agentdialer
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Database. Set an existing secret with key DATABASE_URL, or an inline url.
database:
  existingSecret: ""        # name of a Secret with key DATABASE_URL
  url: ""                   # or an inline url (dev only; prefer a Secret)

# LiveKit runs the rooms where each call meets its agent. The nodes join the
# rooms themselves; no livekit/sip and no webhook.
livekit:
  url: "ws://livekit:7880"
  existingSecret: ""        # Secret with LIVEKIT_API_KEY, LIVEKIT_API_SECRET (preferred)
  apiKey: ""                # or inline values (dev only)
  apiSecret: ""
  roomPrefix: "campaign"

# The calls. Each node sends its INVITEs through the SIP edge (Kamailio,
# deployed separately) and puts its pod IP in Via, Contact, and the SDP.
sip:
  trunk: ""                 # AD_SIP_TRUNK: the carrier's host:port (required with sip_trunk)
  proxy: ""                 # AD_SIP_PROXY: the SIP edge's host:port, e.g. kamailio:5060
  callerId: ""              # AD_SIP_CALLER_ID: E.164, e.g. a Twilio number of the account

# The telephony provider (AD_DIAL_PROVIDER). sip_trunk: the node sends the
# INVITE to sip.trunk. twilio_click_to_call: Twilio calls the lead, then sends
# an INVITE to the SIP edge (README.md, "Click-to-call through Twilio"); it
# needs sip.callerId and the Twilio values below.
telephony:
  provider: "sip_trunk"
  twilio:
    apiUrl: ""              # AD_TWILIO_API_URL (default https://api.twilio.com)
    accountSid: ""          # AD_TWILIO_ACCOUNT_SID: AC...
    sipUri: ""              # AD_TWILIO_SIP_URI: the public SIP URI of the edge
    existingSecret: ""      # Secret with AD_TWILIO_API_KEY and AD_TWILIO_API_SECRET

# The API: a normal Deployment + Service + HPA.
api:
  replicas: 2
  port: 8080
  # The agent session stream (gRPC, decision D-6): the agents report the
  # outcome of each call on it. sessionUrl is the URL that the agents reach;
  # empty: the Service of the api, for agents in the cluster.
  sessionPort: 9090
  sessionUrl: ""
  resources: {}
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# The orchestrator replicas are the cluster nodes. Every replica runs calls;
# one also holds the leader key in kine and schedules. No Service: nothing
# calls the orchestrator.
orchestrator:
  replicas: 2
  batchLimit: 20            # AD_BATCH_LIMIT: leads claimed per claim (within the free capacity)
  callsPerSec: 10           # AD_CALLS_PER_SEC: call starts per second (calls run at the same time)
  retrySweepMs: 1000        # AD_RETRY_SWEEP_MS: interval of the sweep that dials due leads
  eventSweepMs: 2000        # AD_EVENT_SWEEP_MS: max wait before the event table is read again
  attemptCheckMs: 15000     # AD_ATTEMPT_CHECK_MS: interval of the check of live calls against LiveKit
  resources: {}

# The dispatch workers: stateless, N replicas, claim via SKIP LOCKED. Scale
# freely with the HPA. (The orchestrator loop can also drive dispatch; this role
# is for horizontal fan-out.)
dispatch:
  enabled: false
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 50
    targetCPUUtilizationPercentage: 70
  resources: {}

# The migrate Job runs once before upgrade/install (a Helm hook).
migrate:
  enabled: true

# The kine (etcd API) endpoints of the orchestrator nodes (AD_ETCD_ENDPOINTS).
cluster:
  etcdEndpoints: ""
