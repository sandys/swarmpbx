# LiveKit server config for the SIP<->WebRTC spike. Local throwaway only.
port: 7880
rtc:
  tcp_port: 7881
  # Keep the WebRTC range below the host ephemeral range (32768-60999). The e2e
  # stacks use host networking, so a client socket can take an ephemeral port
  # inside an overlapping range first, and the room join then times out.
  port_range_start: 21000
  port_range_end: 21999
  use_external_ip: false
redis:
  address: 127.0.0.1:6379
keys:
  devkey: devsecret_devsecret_devsecret_32b
logging:
  level: info
# LiveKit posts room and participant events to the agentdialer API, which ends
# call attempts on them. The e2e stacks run the API on 127.0.0.1:18090. A stack
# without the API only logs the failed posts.
webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:18090/v1/webhooks/livekit
