# Throwaway spike workspace — NOT production. Proves the media-plane thesis:
# can Rust drive rtpengine (ng) and drachtio (control) to bridge a SIP call?
[workspace]
resolver = "2"
members = ["ad_rtpengine_ctl", "ad_sip_ctl", "ad_router_spike"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
