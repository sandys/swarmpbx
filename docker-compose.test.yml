# Docker-first test tier. Runs identically on a dev machine and in CI.
#
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit \
#       --exit-code-from tests
#   docker compose -f docker-compose.test.yml down -v
#
# The `tests` service runs fmt + clippy + the full suite, including the Postgres
# integration tests, against the `postgres` service in this compose. Named
# volumes cache the cargo registry and the target dir, so repeat runs are fast.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentdialer
      POSTGRES_PASSWORD: agentdialer
      POSTGRES_DB: agentdialer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdialer -d agentdialer"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Point the integration tests at the compose services by name.
      DATABASE_URL: postgres://agentdialer:agentdialer@postgres:5432/agentdialer
      REDIS_URL: redis://redis:6379
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target
    volumes:
      - .:/app:ro
      # Writable caches that survive between runs for speed.
      - cargo-cache:/cache/cargo
      - target-cache:/cache/target
    working_dir: /app
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        echo "== fmt =="
        cargo fmt --all -- --check
        echo "== clippy =="
        cargo clippy --all-targets -- -D warnings
        echo "== tests (incl. postgres integration) =="
        cargo test --all
        echo "== redis integration tests (ad_events) =="
        cargo test -p ad_events --features redis
        echo "OK: all tests green in Docker"

volumes:
  cargo-cache:
  target-cache:
