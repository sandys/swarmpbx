# Docker-first test tier. Runs identically on a dev machine and in CI.
#
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit \
#       --exit-code-from tests
#   docker compose -f docker-compose.test.yml down -v
#
# The `tests` service runs fmt + clippy + the full suite, including the
# Postgres and kine integration tests (data layer, event layer, cluster),
# against the `postgres` and `kine` services in this compose. Named volumes
# cache the cargo registry and the target dir, so repeat runs are fast.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentdialer
      POSTGRES_PASSWORD: agentdialer
      POSTGRES_DB: agentdialer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdialer -d agentdialer"]
      interval: 2s
      timeout: 3s
      retries: 30

  # kine serves the etcd API on Postgres, in its own table `kine` of the
  # agentdialer database. The cluster tests in ad_cluster run against it.
  kine:
    image: rancher/kine:v0.13.17
    command:
      - --endpoint=postgres://agentdialer:agentdialer@postgres:5432/agentdialer?sslmode=disable
      - --listen-address=0.0.0.0:2379
      - --compact-interval=5m
    # kine retries Postgres until it answers; nothing waits on a health check.

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgres:
        condition: service_healthy
      kine:
        condition: service_started
    environment:
      # Point the integration tests at the compose services by name.
      DATABASE_URL: postgres://agentdialer:agentdialer@postgres:5432/agentdialer
      AD_TEST_ETCD_ENDPOINTS: http://kine:2379
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target
    volumes:
      - .:/app:ro
      # Writable caches that survive between runs for speed.
      - cargo-cache:/cache/cargo
      - target-cache:/cache/target
    working_dir: /app
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        echo "== fmt =="
        # Without --all: --all also formats path dependencies, and the
        # vendored crates (vendor/) must stay exact copies.
        cargo fmt -- --check
        echo "== clippy =="
        cargo clippy --all-targets -- -D warnings
        echo "== tests (incl. postgres integration) =="
        cargo test --all
        echo "OK: all tests green in Docker"

volumes:
  cargo-cache:
  target-cache:
